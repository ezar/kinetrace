<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>body{margin:0;font-family:Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}a{color:#d9702f}a:hover{color:#b45a22}
  .av{width:52px;height:52px;border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f5f2; color: #1b1a18; display: flex; flex-direction: column; box-sizing: border-box; padding: 22px 20px 20px; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; color: #6a6761">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span style="font-size: 14px">Ajustes</span>
  </div>
  <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Quién entrena</span>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="background:#fff;border:2px solid #d9702f;border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px">
      <div class="av" style="background:#d9702f">C</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600">César</span><span style="font-size:13px;color:#6a6761">6 días seguidos · 2 rutinas</span></div>
      <span style="font-size:12px;font-weight:600;color:#d9702f;background:#fbeade;padding:6px 12px;border-radius:999px">Activo</span>
    </div>
    <div style="background:#fff;border:1px solid #e3ded6;border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px">
      <div class="av" style="background:#34618f">M</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600">Marta</span><span style="font-size:13px;color:#6a6761">última sesión el martes</span></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6a6761" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #e3ded6;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px">
    <span style="font-size:15px;font-weight:600">Nueva persona</span>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;color:#6a6761">Nombre</span>
      <div style="border:1px solid #e3ded6;border-radius:14px;padding:13px 16px;font-size:16px;color:#1b1a18">Lucía</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;color:#6a6761">Color</span>
      <div style="display:flex;gap:10px">
        <span style="width:38px;height:38px;border-radius:999px;background:#d9702f"></span>
        <span style="width:38px;height:38px;border-radius:999px;background:#34618f"></span>
        <span style="width:38px;height:38px;border-radius:999px;background:#2c7a58;outline:2px solid #1b1a18;outline-offset:3px"></span>
        <span style="width:38px;height:38px;border-radius:999px;background:#8a5bab"></span>
        <span style="width:38px;height:38px;border-radius:999px;background:#b3352a"></span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;color:#6a6761">Notas de mi fisioterapeuta</span>
      <div style="border:1px solid #e3ded6;border-radius:14px;padding:13px 16px;font-size:15px;color:#6a6761;line-height:1.4;min-height:64px">Puente y plancha a diario; nada de flexión lumbar cargada.</div>
      <span style="font-size:12px;color:#6a6761">Kinetrace no lo interpreta: es tu nota.</span>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;gap:10px">
    <button style="flex:1;border:0;cursor:pointer;height:54px;border-radius:999px;background:#1b1a18;color:#f7f5f2;font-family:inherit;font-size:16px;font-weight:600">Guardar</button>
    <button style="cursor:pointer;height:54px;padding:0 22px;border-radius:999px;background:#fff;border:1px solid #e3ded6;font-family:inherit;font-size:16px;color:#6a6761">Cancelar</button>
  </div>
</div>
</x-dc>
</body>
</html>
