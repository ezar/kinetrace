<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>body{margin:0;font-family:Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}a{color:#ff9552}a:hover{color:#ffb182}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #121110; color: #f7f5f2; display: flex; flex-direction: column; box-sizing: border-box; padding: 28px 22px 22px; gap: 20px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 15px; color: #a5a09a">Descanso</span>
    <div style="display: flex; gap: 4px"><span style="width:26px;height:5px;border-radius:999px;background:#ff9552"></span><span style="width:26px;height:5px;border-radius:999px;background:#ff9552"></span><span style="width:26px;height:5px;border-radius:999px;background:#3a3733"></span></div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
    <svg viewBox="0 0 200 200" style="width: 236px">
      <circle cx="100" cy="100" r="86" fill="none" stroke="#2a2825" stroke-width="12"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#ff9552" stroke-width="12" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="190" transform="rotate(-90 100 100)"/>
      <text x="100" y="122" text-anchor="middle" font-size="82" font-weight="800" fill="#f7f5f2" font-family="Figtree, sans-serif">23</text>
    </svg>
    <span style="font-size: 17px; color: #a5a09a">segundos</span>
  </div>

  <div style="border-radius: 22px; background: #1b1a18; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #ff9552">Después</span>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="width: 76px; height: 76px; border-radius: 16px; background: #121110; display: flex; align-items: center; justify-content: center; flex: none">
        <svg viewBox="0 0 220 150" style="width: 86%"><line x1="18" y1="136" x2="202" y2="136" stroke="#3a3733" stroke-width="7" stroke-linecap="round"/><g fill="none" stroke="#f7f5f2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M56 96 L56 130 L82 132"/><path d="M56 96 L116 98 L154 112 L188 132"/></g><circle cx="34" cy="90" r="13" fill="none" stroke="#f7f5f2" stroke-width="9"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 21px; font-weight: 600">Plancha frontal</span>
        <span style="font-size: 15px; color: #a5a09a">3 series · 30 s</span>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: flex-start; border-top: 1px solid #2a2825; padding-top: 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a5a09a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><rect x="3" y="7" width="18" height="12" rx="3"/><circle cx="12" cy="13" r="3.2"/></svg>
      <span style="font-size: 15px; line-height: 1.4; color: #a5a09a; text-wrap: pretty">Deja el móvil donde está: misma vista de lado, a ras de suelo.</span>
    </div>
  </div>

  <button style="border: 0; cursor: pointer; height: 60px; border-radius: 999px; background: #f7f5f2; color: #121110; font-family: inherit; font-size: 19px; font-weight: 600">Saltar el descanso</button>
  <span style="text-align: center; font-size: 13px; color: #6f6a64">o saluda con una mano</span>
</div>
</x-dc>
</body>
</html>
