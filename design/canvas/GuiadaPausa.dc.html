<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>
  body{margin:0;font-family:Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
  a{color:#d9702f}a:hover{color:#b45a22}
  .sec{flex:1;height:48px;border-radius:999px;border:1px solid #e3ded6;background:#fff;color:#1b1a18;font-family:inherit;font-size:16px;cursor:pointer}
  .lado{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#fbeade;color:#9c4a15;font-size:14px;font-weight:600}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#f7f5f2;color:#1b1a18;display:flex;flex-direction:column;box-sizing:border-box;padding:24px 20px 20px;overflow:hidden">

  <!-- The stage in the corner says what the session is doing, so it has to
       change when the session does: it used to read «En marcha» while paused. -->
  <div style="display:flex;align-items:baseline;justify-content:space-between">
    <span style="font-size:14px;color:#6a6761">7 / 12</span>
    <span style="font-size:14px;color:#6a6761">En pausa</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font-size:26px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance">Estiramiento isquiotibial tumbado</span>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="lado">Lado derecho</span>
        <span style="font-size:15px;color:#6a6761">Serie 1 de 2, 30 segundos</span>
      </div>
    </div>

    <!-- Dimmed rather than removed: the figure is the position being held, and
         taking it away mid-pause loses the thing somebody is trying to keep. -->
    <div style="background:#fff;border:1px solid #e3ded6;border-radius:20px;height:190px;display:flex;align-items:center;justify-content:center;flex:none;opacity:.4">
      <svg viewBox="0 0 220 150" style="width:80%">
        <line x1="18" y1="138" x2="202" y2="138" stroke="#ddd5c9" stroke-width="6" stroke-linecap="round"/>
        <g fill="none" stroke="#1b1a18" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M164 130 L100 133"/>
          <path d="M100 133 L60 135 L42 128"/>
          <path d="M100 133 L95 78 L88 34"/>
        </g>
        <g fill="none" stroke="#1b1a18" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M160 129 L128 106 L100 86"/>
        </g>
        <circle cx="184" cy="124" r="13" fill="none" stroke="#1b1a18" stroke-width="8"/>
      </svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <!-- Back to the full dose, because that is what «Seguir» will run. -->
      <div style="display:flex;align-items:baseline;gap:12px;color:#6a6761">
        <span style="font-size:88px;font-weight:800;letter-spacing:-0.04em;line-height:.9">30</span>
        <span style="font-size:17px">segundos</span>
      </div>
      <p style="margin:0;font-size:20px;font-weight:500;line-height:1.3">En pausa</p>
      <!-- The contract, said where it happens. A hold cannot be picked up
           mid-count with nothing watching, so the set starts again. The code
           has said so in a comment since the mode was written; the screen did
           not say it anywhere. A rest is the exception — that one carries on. -->
      <p style="margin:0;font-size:15px;color:#6a6761;line-height:1.45">Al seguir, la serie empieza de nuevo desde el principio.</p>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <button style="border:0;cursor:pointer;height:56px;border-radius:999px;background:#1b1a18;color:#f7f5f2;font-family:inherit;font-size:17px;font-weight:600">Seguir</button>
    <div style="display:flex;gap:10px">
      <button class="sec">Repetir</button>
      <button class="sec">Saltar</button>
    </div>
    <button style="border:0;background:none;cursor:pointer;height:40px;color:#6a6761;font-family:inherit;font-size:15px;text-decoration:underline;text-underline-offset:4px">Terminar sesión</button>
    <span style="text-align:center;font-size:13px;color:#6a6761;line-height:1.4">Los gestos y la voz no están en este modo: se maneja desde la pantalla.</span>
  </div>
</div>
</x-dc>
</body>
</html>
