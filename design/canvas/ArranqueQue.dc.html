<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    a { color: #d9702f; } a:hover { color: #b45a22; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f5f2; color: #1b1a18; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; padding: 16px 20px 24px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; gap: 6px">
      <span style="width: 24px; height: 5px; border-radius: 999px; background: #d9702f"></span>
      <span style="width: 24px; height: 5px; border-radius: 999px; background: #e3ded6"></span>
      <span style="width: 24px; height: 5px; border-radius: 999px; background: #e3ded6"></span>
      <span style="width: 24px; height: 5px; border-radius: 999px; background: #e3ded6"></span>
      <span style="width: 24px; height: 5px; border-radius: 999px; background: #e3ded6"></span>
    </div>
    <span style="font-size: 14px; color: #6a6761">Saltar</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">Un entrenador que te ve</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #6a6761">Haces delante de la cámara los ejercicios que te ha mandado tu fisioterapeuta. Kinetrace cuenta las repeticiones, mide hasta dónde llegas y te va corrigiendo con una indicación cada vez.</p>
    </div>

    <div style="background: #fff; border: 1px solid #e3ded6; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,26,24,.04), 0 8px 24px rgba(27,26,24,.06); padding: 16px; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 240 200" style="width: 100%; height: 208px">
        <line x1="16" y1="182" x2="224" y2="182" stroke="#ddd5c9" stroke-width="7" stroke-linecap="round"/>
        <g fill="none" stroke="#1b1a18" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <path d="M151 112 L133 52"/>
          <path d="M133 52 L89 64"/>
          <path d="M151 112 L97 114 L111 172 L89 178"/>
        </g>
        <path d="M151 112 L97 114 L111 172" fill="none" stroke="#d9702f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="97" cy="114" r="16" fill="none" stroke="#d9702f" stroke-width="4"/>
        <circle cx="125" cy="32" r="14" fill="none" stroke="#1b1a18" stroke-width="9"/>
      </svg>
    </div>

    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #6a6761">Kinetrace no es un producto sanitario y no sustituye a tu fisioterapeuta.</p>
  </div>

  <button style="border: 0; cursor: pointer; height: 56px; border-radius: 999px; background: #1b1a18; color: #f7f5f2; font-family: inherit; font-size: 17px; font-weight: 600">Continuar</button>
</div>
</x-dc>
</body>
</html>
