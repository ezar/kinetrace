<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    a { color: #d9702f; } a:hover { color: #b45a22; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f5f2; color: #1b1a18; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; padding: 16px 20px 24px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <div style="display: flex; gap: 6px">
        <span style="width: 24px; height: 5px; border-radius: 999px; background: #d9702f"></span>
        <span style="width: 24px; height: 5px; border-radius: 999px; background: #d9702f"></span>
        <span style="width: 24px; height: 5px; border-radius: 999px; background: #d9702f"></span>
        <span style="width: 24px; height: 5px; border-radius: 999px; background: #e3ded6"></span>
        <span style="width: 24px; height: 5px; border-radius: 999px; background: #e3ded6"></span>
      </div>
    </div>
    <span style="font-size: 14px; color: #6a6761">Saltar</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 24px 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">¿Quién va a entrenar?</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #6a6761">Cada persona de la casa tiene su perfil y su historial. Puedes añadir más cuando quieras.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; color: #6a6761">Nombre</span>
      <div style="height: 52px; border-radius: 14px; border: 1px solid #cdc6bc; background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 17px; box-shadow: 0 0 0 3px rgba(217,112,47,.14)">
        César<span style="width: 2px; height: 22px; background: #d9702f; margin-left: 2px"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; color: #6a6761">Color</span>
      <div style="display: flex; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #d9702f; box-shadow: 0 0 0 2px #f7f5f2, 0 0 0 4px #1b1a18"></span>
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #34618f"></span>
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #2c7a58"></span>
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #8a5bab"></span>
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #b3352a"></span>
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #3f7f8f"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; color: #6a6761">Idioma</span>
      <div style="display: flex; gap: 8px">
        <span style="font-size: 14px; padding: 8px 16px; border-radius: 999px; border: 1px solid #1b1a18; background: #1b1a18; color: #f7f5f2">Español</span>
        <span style="font-size: 14px; padding: 8px 16px; border-radius: 999px; border: 1px solid #e3ded6; background: #fff">English</span>
      </div>
    </div>
  </div>

  <button style="border: 0; cursor: pointer; height: 56px; border-radius: 999px; background: #1b1a18; color: #f7f5f2; font-family: inherit; font-size: 17px; font-weight: 600">Continuar</button>
</div>
</x-dc>
</body>
</html>
