<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    a { color: #ff9552; } a:hover { color: #ffb182; }
  </style>
</helmet>
<div style="width: 844px; height: 390px; background: #121110; color: #f7f5f2; display: flex; flex-direction: column; box-sizing: border-box; padding: 18px 24px; gap: 12px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-size: 20px; font-weight: 600">Plancha frontal</span>
      <span style="font-size: 15px; color: #a5a09a">Serie 1 de 3</span>
    </div>
    <div style="display: flex; gap: 4px"><span style="width: 30px; height: 5px; border-radius: 999px; background: #ff9552"></span><span style="width: 30px; height: 5px; border-radius: 999px; background: #3a3733"></span><span style="width: 30px; height: 5px; border-radius: 999px; background: #3a3733"></span></div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; gap: 26px">
    <div style="width: 232px; border-radius: 20px; background: #1b1a18; padding: 8px; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 220 150" style="width: 100%">
        <line x1="14" y1="138" x2="206" y2="138" stroke="#3a3733" stroke-width="7" stroke-linecap="round"/>
        <g fill="none" stroke="#f7f5f2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M52 92 L52 130 L78 132"/></g>
        <g fill="none" stroke="#ff9552" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M52 92 L112 96 L186 130"/></g>
        <circle cx="30" cy="86" r="12" fill="none" stroke="#f7f5f2" stroke-width="7"/>
        <circle cx="112" cy="96" r="15" fill="none" stroke="#ff9552" stroke-width="3" opacity=".45"/>
        <g fill="#f7f5f2"><circle cx="52" cy="92" r="5"/></g>
        <circle cx="112" cy="96" r="6.5" fill="#ff9552"/>
      </svg>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-size: 150px; font-weight: 800; letter-spacing: -0.05em; line-height: .85">18</span>
      <span style="font-size: 34px; font-weight: 600; color: #a5a09a">/ 30 s</span>
    </div>

    <div style="margin-left: auto; display: flex; align-items: center; gap: 18px">
      <svg viewBox="0 0 120 120" style="width: 128px; flex: none">
        <circle cx="60" cy="60" r="37" fill="#17402f"/>
        <path d="M21.9 82 A 44 44 0 1 1 98.1 82" fill="none" stroke="#3a3733" stroke-width="16" stroke-linecap="round"/>
        <path d="M45.2 22.5 A 44 44 0 0 1 74.8 22.5" fill="none" stroke="#58cf9a" stroke-width="16"/>
        <circle cx="60" cy="16" r="10" fill="#58cf9a"/>
      </svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 58px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #58cf9a">2°</span>
        <span style="font-size: 16px; color: #a5a09a">línea del cuerpo</span>
      </div>
    </div>
  </div>

  <div style="border-radius: 18px; background: #1b1a18; border: 1px solid #2a2825; color: #a5a09a; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 22px; color: #f7f5f2">aguanta ahí</span>
    <span style="font-size: 13px">Dos manos arriba para pausar · saluda para saltar</span>
  </div>
</div>
</x-dc>
</body>
</html>
