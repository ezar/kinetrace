    <div style="background: #fff; border: 1px solid #e3ded6; border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 14px">

  <div style="background: #fff; border: 1px solid #e3ded6; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">

    </div>
    <span style="font-size: 12px; color: #6a6761; line-height: 1.4">Se guarda como nota tuya. Kinetrace no lo usa para nada más.</span>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="border:0;cursor:pointer;height:56px;border-radius:999px;background:#1b1a18;color:#f7f5f2;font-family:inherit;font-size:17px;font-weight:600">Guardar sesión</button>
