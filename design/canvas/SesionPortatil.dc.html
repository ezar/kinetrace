<x-dc>

    a { color: #ff9552; } a:hover { color: #ffb182; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #121110; color: #f7f5f2; display: flex; flex-direction: column; box-sizing: border-box; padding: 34px 44px 30px; gap: 26px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">

    </div>

          <path d="M66 72 L66 134"/><path d="M66 72 L126 72"/><path d="M126 72 L126 104 L104 134"/><path d="M66 72 L36 52"/>
        </g>
        <g fill="none" stroke="#ff9552" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M126 72 L166 62 L200 54"/></g>
        <circle cx="46" cy="64" r="13" fill="none" stroke="#f7f5f2" stroke-width="8"/>
        <circle cx="126" cy="72" r="16" fill="none" stroke="#ff9552" stroke-width="3" opacity=".45"/>
        <g fill="#f7f5f2"><circle cx="66" cy="72" r="5.5"/><circle cx="126" cy="104" r="5.5"/><circle cx="166" cy="62" r="5.5"/></g>
        <circle cx="126" cy="72" r="7" fill="#ff9552"/>

    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center">
      <div style="display: flex; align-items: baseline; gap: 16px">
        <span style="font-size: 260px; font-weight: 800; letter-spacing: -0.05em; line-height: .82">5</span>

      <div style="display: flex; gap: 8px; margin-top: 16px">
        <span style="width:18px;height:18px;border-radius:999px;background:#58cf9a"></span>
        <span style="width:18px;height:18px;border-radius:999px;background:#58cf9a"></span>
        <span style="width:18px;height:18px;border-radius:999px;background:#ff9552"></span>
        <span style="width:18px;height:18px;border-radius:999px;background:#58cf9a"></span>
        <span style="width:18px;height:18px;border-radius:999px;background:#58cf9a"></span>
        <span style="width:18px;height:18px;border-radius:999px;background:#3a3733"></span>

        <span style="width:18px;height:18px;border-radius:999px;background:#3a3733"></span>

    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">

        <circle cx="60" cy="60" r="37" fill="#17402f"/>
        <path d="M21.9 82 A 44 44 0 1 1 98.1 82" fill="none" stroke="#3a3733" stroke-width="16" stroke-linecap="round"/>
        <path d="M93.7 31.7 A 44 44 0 0 1 104 60" fill="none" stroke="#58cf9a" stroke-width="16"/>

  <div style="border-radius: 22px; background: #ff9552; color: #121110; padding: 26px 34px; display: flex; align-items: center; justify-content: space-between">

  </div>
