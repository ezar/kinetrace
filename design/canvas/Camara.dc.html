<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    a { color: #ff9552; } a:hover { color: #ffb182; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #121110; color: #f7f5f2; display: flex; flex-direction: column; box-sizing: border-box; padding: 24px 20px 20px; gap: 20px; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 3px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #ff9552">Antes de empezar</span>
    <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Coloca la cámara</span>
  </div>

  <div style="position: relative; border-radius: 24px; background: #1b1a18; height: 300px; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <svg viewBox="0 0 220 150" style="width: 92%; position: absolute; opacity: .28">
      <g fill="none" stroke="#f7f5f2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 16">
        <path d="M44 116 L96 74 L150 86 L168 130"/><path d="M44 116 L62 132 L84 134"/>
      </g>
      <circle cx="26" cy="120" r="12" fill="none" stroke="#f7f5f2" stroke-width="9" stroke-dasharray="1 14"/>
    </svg>
    <svg viewBox="0 0 220 150" style="width: 92%; position: relative">
      <line x1="14" y1="138" x2="206" y2="138" stroke="#3a3733" stroke-width="7" stroke-linecap="round"/>
      <g fill="none" stroke="#58cf9a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M46 118 L98 78 L152 90 L170 132"/><path d="M46 118 L64 132 L86 134"/>
      </g>
      <circle cx="28" cy="122" r="12" fill="none" stroke="#58cf9a" stroke-width="7"/>
      <g fill="#58cf9a"><circle cx="46" cy="118" r="5"/><circle cx="98" cy="78" r="5"/><circle cx="152" cy="90" r="5"/></g>
    </svg>
    <span style="position: absolute; bottom: 14px; font-size: 13px; color: #6f6a64">la silueta marca la postura esperada</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #58cf9a; color: #121110; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span style="font-size: 18px">Se te ve entero</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #58cf9a; color: #121110; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span style="font-size: 18px">Distancia</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid #ff9552; display: flex; align-items: center; justify-content: center"></span>
      <span style="font-size: 18px">Orientación</span>
      <span style="margin-left: auto; font-size: 16px; font-weight: 600; color: #ff9552">Ponte de lado</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #58cf9a; color: #121110; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span style="font-size: 18px">Detección</span>
    </div>
  </div>

  <div style="border-radius: 20px; background: #1b1a18; border: 1px solid #2a2825; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a5a09a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><rect x="3" y="7" width="18" height="12" rx="3"/><circle cx="12" cy="13" r="3.2"/><path d="M8 7l1.4-2.2h5.2L16 7"/></svg>
    <span style="font-size: 16px; line-height: 1.45; color: #a5a09a; text-wrap: pretty">Móvil en el suelo apoyado en un libro, a 2,5 m, apuntando a la esterilla desde el lado.</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: center">
    <div style="width: 100%; height: 6px; border-radius: 999px; background: #2a2825; overflow: hidden"><div style="width: 62%; height: 100%; background: #ff9552"></div></div>
    <span style="font-size: 17px; color: #a5a09a">Quieto dos segundos…</span>
  </div>
</div>
</x-dc>
</body>
</html>
