name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version comes from "packageManager" in package.json; setting it here
      # too makes the action fail rather than pick one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck and unit tests
        run: pnpm verify

      - name: Fixtures are up to date
        run: |
          pnpm fixtures:build
          git diff --exit-code fixtures/

      - name: Pose models
        run: pnpm models:fetch

      - name: Build the app
        run: pnpm --filter @kinetrace/web exec vite build

      - name: Install the browser for the end to end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests
        run: pnpm test:e2e
